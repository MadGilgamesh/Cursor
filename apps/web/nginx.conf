server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # API i PWA pod jednym originem — ciasteczko sesji pozostaje pierwszej strony.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Service worker i HTML zawsze świeże, żeby aktualizacje PWA docierały od razu.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Zasoby z hashem w nazwie można cache'ować bezterminowo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Kancelaria na osobnym porcie, ten sam nginx. Ciasteczko personelu zostaje na tym originie.
server {
  listen 81;
  server_name _;
  root /usr/share/nginx/panel;

  location /api/ {
    proxy_pass http://panel:3210;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
