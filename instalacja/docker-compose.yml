# Lokalna paczka. Uruchamiaj z tego katalogu:
#   docker compose up --build                 → baza, Redis, migracje, API, worker, gra, Kancelaria
#   docker compose up -d postgres redis       → tylko infrastruktura do `pnpm dev`
name: zapomniany-brzeg

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgres://game:game@postgres:5432/game
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: info
  # Lokalnie aplikacja działa po HTTP; na produkcji (HTTPS) zostaw domyślne `true`.
  COOKIE_SECURE: 'false'
  # Przed API stoi nginx z kontenera `web`.
  TRUST_PROXY_HOPS: '1'
  # Web Push włącza się po ustawieniu kluczy (pnpm --filter @game/api vapid:generate).
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}

x-build: &repo-build
  context: ..
  dockerfile: instalacja/api.Dockerfile

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
      POSTGRES_DB: game
    ports:
      - '5432:5432'
    volumes:
      # Od PostgreSQL 18 obraz trzyma dane w podkatalogu wersji — montujemy katalog nadrzędny.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U game -d game']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: *repo-build
    command: ['node', 'dist/db/bootstrap.js']
    environment:
      <<: *api-env
      # Seed lokalnej paczki. Hasło nie jest wypisywane w logach.
      SEED_ADMIN_LOGIN: ${SEED_ADMIN_LOGIN:-Gilgamesh}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build: *repo-build
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3000/api/health").then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker:
    build: *repo-build
    command: ['node', 'dist/worker.js']
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  panel:
    build:
      context: ..
      dockerfile: instalacja/panel.Dockerfile
    environment:
      <<: *api-env
      PORT: '3210'
      # Ten sam login co konto gry. Rola administratora ma pełny panel.
      PANEL_STAFF_EMAIL: ${SEED_ADMIN_LOGIN:-Gilgamesh}
      PANEL_STAFF_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin}
      PANEL_STAFF_ROLE: administrator
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3210/api/health").then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: instalacja/web.Dockerfile
    ports:
      - '8080:80'
      - '8081:81'
    depends_on:
      api:
        condition: service_healthy
      panel:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
